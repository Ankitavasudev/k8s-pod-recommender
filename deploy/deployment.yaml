apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-recommender
  namespace: kube-system
  labels:
    app: pod-recommender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-recommender
  template:
    metadata:
      labels:
        app: pod-recommender
    spec:
      serviceAccountName: pod-recommender
      containers:
        - name: manager
          image: pod-recommender:latest
          command:
            - /manager
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      terminationGracePeriodSeconds: 10